name: smk-run

on:
  push:
    branches: [master]
    paths:
      - "workflows/**"
      - "config/**"
      - "scripts/**"
      - "envs/**"
      - "tests/**"
      - "tools/**"
      - "Snakefile"
      - ".github/workflows/smk-run.yaml"
  pull_request:
    paths:
      - "workflows/**"
      - "config/**"
      - "scripts/**"
      - "envs/**"
      - "tests/**"
      - "tools/**"
      - "Snakefile"
      - ".github/workflows/smk-run.yaml"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

concurrency:
  group: smk-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: envs/frag-conda-env.yaml
          environment-name: frag
          cache-environment: true

      - name: Verify required files
        run: |
          set -euo pipefail
          test -f envs/frag-conda-env.yaml
          test -f workflows/test.smk
          test -f config/test.yaml

      - name: Snakemake run
        run: |
          micromamba run -n frag snakemake \
            -s workflows/test.smk \
            --configfile config/test.yaml \
            --cores 4 \
            --printshellcmds \
            --rerun-incomplete \
            --use-conda

      - name: Check pinned outputs
        run: |
          bash tools/check_expected_outputs.sh tests/full
