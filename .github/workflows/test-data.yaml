name: test-data

on:
  pull_request:
    paths:
      - "tools/get_test_data.sh"
      - "tests/**"
      - "config/frag-conda-env.yaml"
      - ".github/workflows/test-data.yaml"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

concurrency:
  group: test-data-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash -l {0}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify env file exists
        run: |
          set -euo pipefail
          test -f config/frag-conda-env.yaml || { echo "Missing: config/frag-conda-env.yaml"; exit 1; }

      - name: Setup Conda (Miniforge3)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          auto-activate-base: true
          use-mamba: true

      - name: Configure channels (strict)
        run: |
          set -euo pipefail
          conda config --set channel_priority strict
          conda config --remove-key channels || true
          conda config --add channels conda-forge
          conda config --add channels bioconda

      - name: Create env
        run: |
          set -euo pipefail
          mamba env create -n frag -f config/frag-conda-env.yaml -vv || \
            conda env create -n frag -f config/frag-conda-env.yaml -vv
          conda run -n frag samtools --version || true

      - name: Execute get_test_data.sh + sanity checks
        run: |
          set -euo pipefail
          conda activate frag
          chmod +x tools/get_test_data.sh
          ./tools/get_test_data.sh

          test -d tests/full || { echo "tests/full not created" >&2; exit 1; }
          fq_count=$(find tests/full -type f -name "*fastq.gz" | wc -l)
          (( fq_count >= 8 )) || { echo "Expected >=8 FASTQs, got ${fq_count}"; exit 1; }
          fa_count=$(find tests/full -type f -name "*.fa.gz" | wc -l)
          (( fa_count >= 1 )) || { echo "Expected >=1 reference FASTA"; exit 1; }
          echo "OK: test data present."
