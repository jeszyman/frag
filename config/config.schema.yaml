$schema: "https://json-schema.org/draft/2020-12/schema"
title: frag wrapper configuration (workflows/test.smk, workflows/cfdna-test.smk)
type: object
required: [conda, directories, sample-tsv-path, frag_ref_assemblies, gc5mb, blklist, cytoband]
properties:
  conda:
    type: object
    required: [frag]
    additionalProperties: false
    properties:
      frag: {type: string, description: "frag conda env yaml, relative to workflows/ or absolute"}
  directories:
    type: object
    required: [inputs, frag, logs, benchmark]
    additionalProperties: false
    properties:
      inputs: {type: string, description: directory holding the raw FASTQs and the reference FASTA}
      frag: {type: string, description: output root}
      logs: {type: string, description: per-rule logs}
      benchmark: {type: string, description: per-rule benchmarks}
  sample-tsv-path:
    type: string
    description: "sample sheet (r1_basename, r2_basename, library_id, cohort), relative to the run directory"
  frag_ref_assemblies:
    type: object
    minProperties: 1
    description: "reference name -> assembly; the name is the {ref_name} wildcard and must not contain a dot"
    propertyNames: {pattern: "^[^.]+$"}
    additionalProperties:
      type: object
      required: [input]
      additionalProperties: false
      properties:
        url: {type: string, description: source of the FASTA (documentation only)}
        name: {type: string}
        input: {type: string, description: "reference FASTA (.fa.gz) under directories.inputs"}
  gc5mb: {type: string, description: BED of GC/mappability-restricted regions}
  blklist: {type: string, description: blacklist BED (.bed or .bed.gz)}
  cytoband: {type: string, description: UCSC cytoBand table for chromosome arms}
  healthy_libraries:
    type: array
    items: {type: string}
    description: library ids used as the healthy reference (GC summary, arm z-scores)
  fastp:
    type: object
    additionalProperties: false
    properties:
      extra: {type: string, description: extra fastp arguments}
  end_motif:
    type: object
    additionalProperties: false
    properties:
      max_ends:
        type: ["integer", "null"]
        minimum: 1
        description: "cap on the ends counted per library, by read-name-hash subsampling; null counts every end"
      seed: {type: integer, description: subsample seed}
  length_hist:
    type: object
    additionalProperties: false
    properties:
      start: {type: integer, minimum: 0, description: shortest fragment length in the histograms (bp)}
      end: {type: integer, minimum: 1, description: longest fragment length in the histograms (bp)}
  nmf:
    type: object
    additionalProperties: false
    properties:
      n_components: {type: integer, minimum: 1}
  fprofiles:
    type: object
    additionalProperties: false
    properties:
      n_components: {type: integer, minimum: 1}
