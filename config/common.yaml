# frag configuration template. Replace every /path/to value; paths expand ${HOME}.
available-concurrency: 100
repo-dir: ${HOME}/repos/frag

conda:
  frag: "../envs/frag-conda-env.yaml"

directories:
  inputs: /path/to/inputs
  frag: /path/to/frag
  logs: /path/to/frag/logs
  benchmark: /path/to/frag/benchmark

sample-tsv-path: config/samples.tsv

frag_ref_assemblies:
  ncbi_hg38:
    url: https://ftp.ncbi.nlm.nih.gov/genomes/all/GCA/000/001/405/GCA_000001405.15_GRCh38/seqs_for_alignment_pipelines.ucsc_ids/GCA_000001405.15_GRCh38_no_alt_analysis_set.fna.gz
    name: ncbi_hg38
    input: GCA_000001405.15_GRCh38_no_alt_analysis_set.fa.gz

delfi_bins: ${HOME}/repos/frag/resources/data/delfi_bins_hg38.tsv   # the bin table shipped in the frag repository
blklist: /path/to/hg38-blacklist.v2.bed.gz
cytoband: /path/to/cytoBand.txt

healthy_libraries:
  - sample1

fastp:
  extra: ""

end_motif:
  max_ends: null   # null counts every qualifying fragment end; an integer caps the count
  seed: 42

length_hist:
  start: 30
  end: 700

nmf:
  n_components: 2

fprofiles:
  n_components: 6
